# pms-repair · 同域托管 admin-web 静态站 + 反代 API
# /opt/pms-repair/web/        ← admin-web `pnpm web:build` 产物 (dist/)
# 127.0.0.1:4000              ← NestJS API (pm2)
#
# 路径分流：
#   /api/        → 反代到 node:4000（NestJS globalPrefix 是 api/v1，所以请求形如 /api/v1/health）
#   其它任意路径 → 静态站 + SPA fallback 回 /index.html
#
# 备案 + HTTPS 后再换 server_name 为 admin.<your-domain>.cn 并加 443 server block。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50m;

    # 让前端能透传真实 ip / 协议给 nginx 自己的 log
    real_ip_header X-Forwarded-For;

    # ---- API 反代 ----
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- admin-web 静态站 ----
    root /opt/pms-repair/web;
    index index.html;

    # Vite 产物 hash 化，可大胆长缓存
    location ^~ /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 小程序养护单手写体（apps/admin-web/public/fonts）：员工端 wx.loadFontFace 跨域加载，
    # 必须带 CORS 头；文件名固定不带哈希，缓存 30 天即可
    location ^~ /fonts/ {
        add_header Access-Control-Allow-Origin "*";
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback：未命中实文件 → 返回 index.html，由 React Router 接管
    # index.html 本身不缓存，否则发布不生效
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
